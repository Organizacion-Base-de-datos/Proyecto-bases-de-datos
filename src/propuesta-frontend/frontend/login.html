<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión - Papelería</title>
    <link rel="stylesheet" href="../../css/estilos.css">
</head>
<body>

<div id="mensaje-global" class="msg-global"></div>

<div class="login-fondo">
    <form class="login-caja" id="form-login">
        <h1>Papelería</h1>
        <p class="sub">Acceso para empleados</p>

        <div class="campo">
            <label for="usuario">Usuario</label>
            <input type="text" id="usuario" autocomplete="username">
        </div>

        <div class="campo">
            <label for="password">Contraseña</label>
            <input type="password" id="password" autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-ancho">Entrar</button>
    </form>
</div>

<script src="../../js/comun.js"></script>
<script>
document.getElementById('form-login').addEventListener('submit', function (e) {
    e.preventDefault();

    var usuario  = document.getElementById('usuario').value.trim();
    var password = document.getElementById('password').value;

    if (usuario === '' || password === '') {
        mostrarMensaje('Escribe tu usuario y contraseña', '#e74c3c');
        return;
    }

    // TODO: aquí se enviará usuario y password al servidor (API) y él los verificará.
    // El Front End nunca debe comparar ni guardar contraseñas.
    // Por ahora solo simulamos que el login fue correcto:
    window.location.href = 'index.html';
});
</script>

</body>
</html>
